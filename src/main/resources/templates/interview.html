<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI Interview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 800px; margin-top: 30px; }
        .chat-container { background-color: #f8f9fa; border-radius: 8px; padding: 20px; min-height: 400px; }
        .message { margin-bottom: 15px; padding: 10px 15px; border-radius: 10px; max-width: 80%; }
        .message.question { background-color: #007bff; color: white; margin-right: auto; }
        .message.answer { background-color: #28a745; color: white; margin-left: auto; text-align: right; }
        .message.feedback { background-color: #ffc107; color: #212529; margin-left: auto; font-size: 0.9em; }
        .message.system { background-color: #6c757d; color: white; text-align: center; font-size: 0.85em; }
        .question-type { font-size: 0.75em; opacity: 0.8; }
        .question-meta { font-size: 0.8em; opacity: 0.7; margin-bottom: 5px; }
        .status-badge { padding: 5px 10px; border-radius: 5px; font-size: 0.85em; }
        .status-active { background-color: #d4edda; color: #155724; }
        .status-completed { background-color: #cce5ff; color: #004085; }
        .loading { text-align: center; padding: 20px; }
        .loading::after { content: '...'; animation: dots 1.5s infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; } }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>AI Interview</h2>
        <div>
            <span class="me-3" id="userInfo"></span>
            <a href="/" class="btn btn-outline-secondary btn-sm">Back to Dashboard</a>
        </div>
    </div>

    <!-- Start Interview Form -->
    <div class="card mb-4" id="startSection">
        <div class="card-header bg-primary text-white">
            Start New Interview
        </div>
        <div class="card-body">
            <form id="startForm">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Resume ID</label>
                        <input type="text" class="form-control" name="resume_id" id="resumeId" required placeholder="e.g., resume-001">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Session ID</label>
                        <input type="text" class="form-control" name="session_id" id="sessionId" required placeholder="e.g., session-001">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Interview Mode</label>
                        <select class="form-select" name="interview_mode" id="interviewMode">
                            <option value="free">Free Interview</option>
                            <option value="training">Training Mode</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Feedback Mode</label>
                        <select class="form-select" name="feedback_mode" id="feedbackMode">
                            <option value="recorded">Recorded (Feedback at end)</option>
                            <option value="realtime">Realtime (Immediate feedback)</option>
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Max Series</label>
                        <input type="number" class="form-control" name="max_series" id="maxSeries" value="5" min="1" max="20">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Error Threshold</label>
                        <input type="number" class="form-control" name="error_threshold" id="errorThreshold" value="2" min="1" max="5">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Knowledge Base ID (Optional)</label>
                        <input type="text" class="form-control" name="knowledge_base_id" id="knowledgeBaseId" placeholder="e.g., kb-001">
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100" id="startBtn">Start Interview</button>
            </form>
        </div>
    </div>

    <!-- Interview Chat Area -->
    <div class="card" id="interviewSection" style="display: none;">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span id="sessionInfo">Interview Session</span>
            <span class="status-badge status-active" id="statusBadge">Active</span>
        </div>
        <div class="card-body">
            <div class="chat-container" id="chatContainer">
                <div class="loading" id="loadingIndicator">Waiting for first question</div>
            </div>
        </div>
        <div class="card-footer" id="answerSection" style="display: none;">
            <div class="input-group">
                <textarea class="form-control" id="answerInput" rows="2" placeholder="Type your answer here..."></textarea>
                <button class="btn btn-primary" id="submitAnswerBtn">Submit Answer</button>
            </div>
            <div class="mt-2">
                <button class="btn btn-outline-secondary btn-sm" id="endInterviewBtn">End Interview</button>
            </div>
        </div>
    </div>

    <!-- Final Feedback -->
    <div class="card mt-4" id="feedbackSection" style="display: none;">
        <div class="card-header bg-success text-white">
            Interview Completed - Final Feedback
        </div>
        <div class="card-body" id="finalFeedbackContent"></div>
    </div>
</div>

<script>
$(document).ready(function() {
    var currentSessionId = null;
    var currentQuestionId = null;
    var eventSource = null;
    var isInterviewActive = false;

    // Display user info
    $.get('/api/auth/me', function(user) {
        $('#userInfo').text('Welcome, ' + (user.username || 'User'));
    }).fail(function() {
        $('#userInfo').text('Welcome');
    });

    // Start interview
    $('#startForm').submit(function(e) {
        e.preventDefault();
        startInterview();
    });

    function startInterview() {
        var request = {
            resume_id: $('#resumeId').val(),
            session_id: $('#sessionId').val(),
            interview_mode: $('#interviewMode').val(),
            feedback_mode: $('#feedbackMode').val(),
            max_series: parseInt($('#maxSeries').val()),
            error_threshold: parseInt($('#errorThreshold').val())
        };
        if ($('#knowledgeBaseId').val()) {
            request.knowledge_base_id = $('#knowledgeBaseId').val();
        }

        $.ajax({
            url: '/api/interview/start',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(request),
            success: function(response) {
                currentSessionId = response.session_id;
                isInterviewActive = true;
                $('#startSection').hide();
                $('#interviewSection').show();
                $('#sessionInfo').text('Session: ' + currentSessionId);
                $('#chatContainer').empty();
                $('#loadingIndicator').show();

                if (response.first_question) {
                    currentQuestionId = response.first_question.question_id;
                    appendQuestion(response.first_question);
                    $('#answerSection').show();
                    $('#answerInput').focus();
                }

                // Connect to SSE stream
                connectSSE();
            },
            error: function(xhr) {
                alert('Failed to start interview: ' + (xhr.responseJSON?.detail || 'Unknown error'));
            }
        });
    }

    function connectSSE() {
        if (eventSource) {
            eventSource.close();
        }

        eventSource = new EventSource('/api/interview/question?session_id=' + encodeURIComponent(currentSessionId));

        eventSource.addEventListener('question', function(e) {
            var data = JSON.parse(e.data);
            currentQuestionId = data.question_id;
            appendQuestion(data);
            $('#loadingIndicator').hide();
            $('#answerSection').show();
            $('#answerInput').prop('disabled', false).focus();
        });

        eventSource.addEventListener('feedback', function(e) {
            var data = JSON.parse(e.data);
            appendFeedback(data);
        });

        eventSource.addEventListener('end', function(e) {
            var data = JSON.parse(e.data);
            isInterviewActive = false;
            $('#statusBadge').removeClass('status-active').addClass('status-completed').text('Completed');
            $('#answerSection').hide();
            $('#answerInput').prop('disabled', true);
            appendSystemMessage('Interview completed! Thank you for participating.');
            showFinalFeedback(data);
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
        });

        eventSource.addEventListener('error', function(e) {
            console.error('SSE error:', e);
            appendSystemMessage('Connection error. Please try again.');
            $('#loadingIndicator').text('Connection lost');
        });

        eventSource.onerror = function() {
            if (isInterviewActive) {
                appendSystemMessage('SSE connection lost. Attempting to reconnect...');
            }
        };
    }

    function appendQuestion(question) {
        var typeLabel = question.question_type || 'initial';
        var html = '<div class="message question">';
        html += '<div class="question-meta">Q' + question.series + '.' + question.number + ' [' + typeLabel + ']</div>';
        html += '<div>' + question.content + '</div>';
        html += '</div>';
        $('#chatContainer').append(html);
        scrollToBottom();
    }

    function appendFeedback(feedback) {
        var html = '<div class="message feedback">';
        html += '<strong>Feedback:</strong> ' + feedback.content;
        if (feedback.guidance) {
            html += '<br><em>Guidance: ' + feedback.guidance + '</em>';
        }
        html += '</div>';
        $('#chatContainer').append(html);
        scrollToBottom();
    }

    function appendAnswer(answer) {
        var html = '<div class="message answer">';
        html += '<div class="question-meta">Your Answer:</div>';
        html += '<div>' + answer + '</div>';
        html += '</div>';
        $('#chatContainer').append(html);
        scrollToBottom();
    }

    function appendSystemMessage(message) {
        var html = '<div class="message system">' + message + '</div>';
        $('#chatContainer').append(html);
        scrollToBottom();
    }

    function scrollToBottom() {
        var container = $('#chatContainer');
        container.scrollTop(container[0].scrollHeight);
    }

    // Submit answer
    $('#submitAnswerBtn').click(function() {
        var answer = $('#answerInput').val().trim();
        if (!answer) {
            alert('Please enter an answer');
            return;
        }
        if (!currentSessionId || !currentQuestionId) {
            alert('No active interview session');
            return;
        }

        $('#answerInput').prop('disabled', true);
        appendAnswer(answer);
        $('#loadingIndicator').show().text('Waiting for feedback...');

        $.ajax({
            url: '/api/interview/answer',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                session_id: currentSessionId,
                question_id: currentQuestionId,
                user_answer: answer
            }),
            success: function(response) {
                $('#answerInput').val('');
                currentQuestionId = response.question_id;

                if (response.feedback) {
                    appendFeedback(response.feedback);
                }

                if (response.next_question_content) {
                    appendQuestion({
                        question_id: response.next_question_id,
                        content: response.next_question_content,
                        series: 1,
                        number: 1,
                        question_type: 'followup'
                    });
                    $('#answerInput').prop('disabled', false).focus();
                }

                if (!response.should_continue || response.interview_status === 'completed') {
                    endInterview();
                }

                $('#loadingIndicator').hide();
            },
            error: function(xhr) {
                alert('Failed to submit answer: ' + (xhr.responseJSON?.detail || 'Unknown error'));
                $('#answerInput').prop('disabled', false);
                $('#loadingIndicator').hide();
            }
        });
    });

    // End interview
    $('#endInterviewBtn').click(function() {
        if (!currentSessionId) return;
        endInterview();
    });

    function endInterview() {
        if (!currentSessionId) return;
        isInterviewActive = false;

        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }

        $.ajax({
            url: '/api/interview/end?session_id=' + encodeURIComponent(currentSessionId),
            method: 'POST',
            success: function(response) {
                $('#statusBadge').removeClass('status-active').addClass('status-completed').text('Completed');
                $('#answerSection').hide();
                appendSystemMessage('Interview ended. Final results are being processed...');
                showFinalFeedback(response);
            },
            error: function(xhr) {
                alert('Failed to end interview: ' + (xhr.responseJSON?.detail || 'Unknown error'));
            }
        });
    }

    function showFinalFeedback(data) {
        var html = '';
        if (data.final_feedback) {
            var fb = data.final_feedback;
            html += '<h5>Overall Score: ' + (fb.overall_score * 100).toFixed(0) + '%</h5>';
            if (fb.series_scores) {
                html += '<p><strong>Series Scores:</strong> ';
                for (var key in fb.series_scores) {
                    html += 'Series ' + key + ': ' + (fb.series_scores[key] * 100).toFixed(0) + '% ';
                }
                html += '</p>';
            }
            if (fb.strengths && fb.strengths.length > 0) {
                html += '<p><strong>Strengths:</strong></p><ul>';
                fb.strengths.forEach(function(s) { html += '<li>' + s + '</li>'; });
                html += '</ul>';
            }
            if (fb.weaknesses && fb.weaknesses.length > 0) {
                html += '<p><strong>Weaknesses:</strong></p><ul>';
                fb.weaknesses.forEach(function(w) { html += '<li>' + w + '</li>'; });
                html += '</ul>';
            }
            if (fb.suggestions && fb.suggestions.length > 0) {
                html += '<p><strong>Suggestions:</strong></p><ul>';
                fb.suggestions.forEach(function(s) { html += '<li>' + s + '</li>'; });
                html += '</ul>';
            }
        }
        html += '<p class="mt-3"><strong>Total Questions:</strong> ' + (data.total_questions || 0) + '</p>';
        html += '<p><strong>Total Series:</strong> ' + (data.total_series || 0) + '</p>';
        $('#finalFeedbackContent').html(html);
        $('#feedbackSection').show();
    }

    // Cleanup on page unload
    $(window).on('beforeunload', function() {
        if (eventSource) {
            eventSource.close();
        }
    });
});
</script>
</body>
</html>
