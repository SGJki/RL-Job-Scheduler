<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Knowledge Query</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 900px; margin-top: 30px; }
        .result-card { margin-bottom: 15px; }
        .result-card .card-body { padding: 15px; }
        .result-score { font-size: 0.85em; color: #6c757d; }
        .result-source { font-size: 0.8em; color: #17a2b8; }
        .result-skill { font-size: 0.75em; background-color: #e2e6ea; padding: 2px 8px; border-radius: 10px; margin-left: 10px; }
        .loading { text-align: center; padding: 20px; color: #6c757d; }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Knowledge Query</h2>
        <div>
            <span class="me-3" id="userInfo"></span>
            <a href="/" class="btn btn-outline-secondary btn-sm">Back to Dashboard</a>
        </div>
    </div>

    <!-- Query Form -->
    <div class="card mb-4">
        <div class="card-header bg-secondary text-white">
            Query Knowledge Base
        </div>
        <div class="card-body">
            <form id="queryForm">
                <div class="row mb-3">
                    <div class="col-md-8">
                        <label class="form-label">Search Query</label>
                        <input type="text" class="form-control" name="query" id="queryInput" required
                               placeholder="e.g., How to implement distributed caching with Redis?">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Knowledge Base ID</label>
                        <input type="text" class="form-control" name="knowledge_base_id" id="kbId" required
                               placeholder="e.g., kb-001">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Number of Results (Top K)</label>
                        <input type="number" class="form-control" name="top_k" id="topK" value="5" min="1" max="20">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="queryBtn">Search</button>
                <button type="button" class="btn btn-outline-secondary" id="clearBtn">Clear Results</button>
            </form>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div class="loading" id="loadingIndicator" style="display: none;">
        Searching knowledge base<span class="loading-dots">...</span>
    </div>

    <!-- Results -->
    <div id="resultsSection">
        <h4 class="mb-3">Search Results <small id="resultsCount"></small></h4>
        <div id="resultsContainer"></div>
    </div>

    <!-- Empty State -->
    <div class="text-center text-muted py-5" id="emptyState">
        <p class="fs-4">No results yet</p>
        <p>Enter a query above to search the knowledge base.</p>
    </div>
</div>

<style>
.loading-dots::after { content: ''; animation: dots 1.5s infinite; }
@keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; } }
</style>

<script>
$(document).ready(function() {
    // Display user info
    $.get('/api/auth/me', function(user) {
        $('#userInfo').text('Welcome, ' + (user.username || 'User'));
    }).fail(function() {
        $('#userInfo').text('Welcome');
    });

    // Query form submit
    $('#queryForm').submit(function(e) {
        e.preventDefault();
        executeQuery();
    });

    // Clear button
    $('#clearBtn').click(function() {
        $('#queryInput').val('');
        $('#kbId').val('');
        $('#resultsContainer').empty();
        $('#resultsCount').text('');
        $('#emptyState').show();
    });

    function executeQuery() {
        var query = $('#queryInput').val().trim();
        var kbId = $('#kbId').val().trim();
        var topK = parseInt($('#topK').val()) || 5;

        if (!query) {
            alert('Please enter a search query');
            return;
        }
        if (!kbId) {
            alert('Please enter a knowledge base ID');
            return;
        }

        $('#loadingIndicator').show();
        $('#resultsSection').hide();
        $('#emptyState').hide();

        $.ajax({
            url: '/api/knowledge/query',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                query: query,
                knowledge_base_id: kbId,
                top_k: topK
            }),
            success: function(response) {
                $('#loadingIndicator').hide();
                displayResults(response);
            },
            error: function(xhr) {
                $('#loadingIndicator').hide();
                alert('Query failed: ' + (xhr.responseJSON?.detail || 'Unknown error'));
                $('#emptyState').show();
            }
        });
    }

    function displayResults(response) {
        $('#resultsSection').show();

        if (!response.results || response.results.length === 0) {
            $('#resultsContainer').html('<div class="alert alert-info">No results found for your query.</div>');
            $('#resultsCount').text('');
            return;
        }

        $('#resultsCount').text('(' + response.total + ' found)');

        var html = '';
        response.results.forEach(function(result, index) {
            var scorePercent = (result.score * 100).toFixed(1);
            var source = result.metadata?.source || 'Unknown';
            var skillPoint = result.metadata?.skill_point || '';

            html += '<div class="card result-card">';
            html += '<div class="card-body">';
            html += '<div class="d-flex justify-content-between align-items-start mb-2">';
            html += '<h6 class="mb-0">Result #' + (index + 1) + '</h6>';
            html += '<span class="result-score">Score: ' + scorePercent + '%</span>';
            html += '</div>';
            html += '<div class="mb-2">' + escapeHtml(result.content) + '</div>';
            html += '<div>';
            html += '<span class="result-source">Source: ' + escapeHtml(source) + '</span>';
            if (skillPoint) {
                html += '<span class="result-skill">' + escapeHtml(skillPoint) + '</span>';
            }
            html += '</div>';
            html += '</div>';
            html += '</div>';
        });

        $('#resultsContainer').html(html);
    }

    function escapeHtml(text) {
        if (!text) return '';
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
});
</script>
</body>
</html>
